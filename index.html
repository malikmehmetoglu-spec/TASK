<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مهامي</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0E1F3D;--navy-2:#18305A;--yellow:#FFC629;--white:#fff;--ink:#0E1F3D;--soft:#8A94A6;--line:#ECEEF2;
        --scroll-thumb:rgba(14,31,61,.18);--scroll-thumb-hover:rgba(14,31,61,.32);color-scheme:light}
  *{box-sizing:border-box;margin:0;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px}::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover)}
  ::-webkit-scrollbar-button,::-webkit-scrollbar-corner{display:none}
  body{font-family:"Rubik",sans-serif;background:var(--white);color:var(--ink);height:100vh;display:flex}
  button,input,select{font:inherit;color:inherit}

  /* side */
  aside{width:250px;flex:none;background:var(--navy);color:var(--white);padding:32px 18px;display:flex;flex-direction:column;gap:4px}
  .logo{font-weight:700;font-size:22px;padding:0 12px 28px}.logo i{font-style:normal;color:var(--yellow)}
  .org{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:0;background:none;color:rgba(255,255,255,.7);cursor:pointer;text-align:right;font-size:16px}
  .org:hover{background:var(--navy-2);color:var(--white)}
  .org.on{background:var(--yellow);color:var(--navy);font-weight:500}
  .org b{font-weight:500;font-size:13px;opacity:.8}
  .sync{margin-top:auto;padding:12px;font-size:12px;color:rgba(255,255,255,.45)}

  /* main */
  main{flex:1;overflow:auto;padding:48px 56px}
  .inner{max-width:680px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  h1{font-size:32px;font-weight:700}
  .pdf{border:0;background:var(--navy);color:var(--white);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500}
  .pdf:hover{background:var(--navy-2)}
  .add{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--navy);padding:6px 0 12px;margin-bottom:12px}
  .add input{flex:1;border:0;outline:0;font-size:18px;background:none}
  .add input::placeholder{color:var(--soft)}
  .add span{color:var(--yellow);font-size:26px;line-height:1;font-weight:700}
  .row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .row:hover .x{opacity:1}
  .box{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--navy);background:none;cursor:pointer;display:grid;place-items:center}
  .row.done .box{background:var(--yellow);border-color:var(--yellow)}
  .row.done .box::after{content:"";width:6px;height:10px;border:solid var(--navy);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .txt{flex:1;font-size:16px}
  .row.done .txt{color:var(--soft);text-decoration:line-through}
  .tag{font-size:12px;color:var(--soft)}
  .x{opacity:0;border:0;background:none;color:var(--soft);cursor:pointer;font-size:18px;transition:.15s}
  .x:hover{color:#C0392B}
  .sec{margin-top:28px;font-size:13px;color:var(--soft);border:0;background:none;cursor:pointer;padding:0}
  .empty{color:var(--soft);padding:28px 4px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(14,31,61,.45);display:none;place-items:center}
  .modal.open{display:grid}
  .sheet{background:var(--white);border-radius:16px;padding:28px;width:340px}
  .sheet h3{font-size:18px;margin-bottom:18px}
  .sheet label{display:block;font-size:13px;color:var(--soft);margin-bottom:14px}
  .sheet input{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px}
  .sheet .btns{display:flex;gap:8px;margin-top:6px}
  .sheet .btns button{flex:1;padding:11px;border-radius:10px;border:0;cursor:pointer;font-weight:500}
  .go{background:var(--yellow);color:var(--navy)}.no{background:var(--line)}

  @media(max-width:720px){body{flex-direction:column}aside{width:auto;flex-direction:row;overflow-x:auto;padding:12px}.logo,.sync{display:none}.org{white-space:nowrap;gap:8px}main{padding:28px 20px}}

  /* report */
  #report{display:none}
  @page{size:A4;margin:16mm}
  @media print{
    body{display:block;height:auto}aside,main,.modal{display:none!important}#report{display:block}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .rh{border-bottom:4px solid var(--yellow);padding-bottom:16px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end}
  .rh h2{font-size:26px;color:var(--navy)}.rh p{font-size:13px;color:var(--soft);margin-top:6px}
  .rn{background:var(--navy);color:var(--white);border-radius:12px;padding:14px 22px;text-align:center}
  .rn b{display:block;font-size:28px;color:var(--yellow)}.rn small{font-size:12px}
  .rr{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .rr i{font-style:normal;color:var(--soft);width:24px}.rr span{flex:1}.rr em{font-style:normal;color:var(--soft);font-size:13px}
</style>
</head>
<body>
<aside id="side"><div class="logo">مهام<i>ي</i></div><div id="orgs"></div><div class="sync" id="sync"></div></aside>

<main><div class="inner">
  <div class="top"><h1 id="title"></h1><button class="pdf" id="pdfBtn">تقرير PDF</button></div>
  <form class="add" id="add"><span>+</span><input id="inp" placeholder="أضف مهمة واضغط Enter" autocomplete="off" /></form>
  <div id="open"></div>
  <button class="sec" id="toggleDone"></button>
  <div id="done" hidden></div>
</div></main>

<div class="modal" id="modal"><div class="sheet">
  <h3>تقرير المهام المنفذة</h3>
  <label>من<input type="date" id="rFrom" /></label>
  <label>إلى<input type="date" id="rTo" /></label>
  <div class="btns"><button class="go" id="rGo">طباعة / حفظ PDF</button><button class="no" id="rNo">إلغاء</button></div>
</div></div>

<div id="report"></div>

<script>
const ORGS=["MedGlobal","ChildGuardians","ACU","MED","Sakka"];
let tasks=[],sha=null,cur=localStorage.getItem("org")||ORGS[0],q=Promise.resolve();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("ar-EG-u-nu-latn",{year:"numeric",month:"long",day:"numeric"}):"";

async function api(method,body){
  const h={"Content-Type":"application/json"},p=localStorage.getItem("pw");if(p)h["x-app-password"]=p;
  const r=await fetch("/api/tasks",{method,headers:h,body:body&&JSON.stringify(body)});
  if(r.status===401){const n=prompt("كلمة المرور:");if(n){localStorage.setItem("pw",n);return api(method,body)}}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;
}
const sync=t=>$("sync").textContent=t;
async function load(){
  try{const j=await api("GET");tasks=j.tasks;sha=j.sha;sync("محفوظ ✓")}
  catch(e){tasks=JSON.parse(localStorage.getItem("cache")||"[]");sync("غير متصل")}
  render();
}
function save(msg){
  localStorage.setItem("cache",JSON.stringify(tasks));sync("جارٍ الحفظ…");
  q=q.then(async()=>{try{sha=(await api("PUT",{tasks,sha,message:msg})).sha;sync("محفوظ ✓")}catch(e){sync("فشل الحفظ")}});
}

function row(t){return `<div class="row ${t.done?"done":""}"><button class="box" data-t="${t.id}" aria-label="تم"></button>
  <div class="txt">${esc(t.title)}</div>${t.done?`<span class="tag">${fmt(t.doneAt)}</span>`:""}<button class="x" data-d="${t.id}" aria-label="حذف">×</button></div>`}
function render(){
  $("orgs").innerHTML=ORGS.map(o=>`<button class="org ${o===cur?"on":""}" data-o="${o}">${o}<b>${tasks.filter(t=>t.org===o&&!t.done).length||""}</b></button>`).join("");
  $("title").textContent=cur;
  const mine=tasks.filter(t=>t.org===cur),open=mine.filter(t=>!t.done),done=mine.filter(t=>t.done).sort((a,b)=>b.doneAt.localeCompare(a.doneAt));
  $("open").innerHTML=open.length?open.map(row).join(""):`<div class="empty">لا مهام مفتوحة.</div>`;
  $("done").innerHTML=done.map(row).join("");
  $("toggleDone").textContent=done.length?`${$("done").hidden?"عرض":"إخفاء"} المنجزة (${done.length})`:"";
}

$("orgs").onclick=e=>{const b=e.target.closest("[data-o]");if(!b)return;cur=b.dataset.o;localStorage.setItem("org",cur);render();$("inp").focus()};
$("add").onsubmit=e=>{e.preventDefault();const v=$("inp").value.trim();if(!v)return;
  tasks.push({id:crypto.randomUUID(),title:v,org:cur,done:false,doneAt:null,createdAt:today()});$("inp").value="";render();save("مهمة: "+v)};
document.querySelector("main").onclick=e=>{
  const t=e.target.closest("[data-t]"),d=e.target.closest("[data-d]");
  if(t){const x=tasks.find(k=>k.id===t.dataset.t);x.done=!x.done;x.doneAt=x.done?today():null;render();save((x.done?"تم: ":"إعادة: ")+x.title)}
  if(d){const x=tasks.find(k=>k.id===d.dataset.d);if(!confirm("حذف «"+x.title+"»؟"))return;tasks=tasks.filter(k=>k!==x);render();save("حذف: "+x.title)}
};
$("toggleDone").onclick=()=>{$("done").hidden=!$("done").hidden;render()};

$("pdfBtn").onclick=()=>{$("rFrom").value=today().slice(0,8)+"01";$("rTo").value=today();$("modal").classList.add("open")};
$("rNo").onclick=()=>$("modal").classList.remove("open");
$("rGo").onclick=()=>{
  const f=$("rFrom").value,to=$("rTo").value;
  const rows=tasks.filter(t=>t.org===cur&&t.done&&(!f||t.doneAt>=f)&&(!to||t.doneAt<=to)).sort((a,b)=>a.doneAt.localeCompare(b.doneAt));
  $("report").innerHTML=`<div class="rh"><div><h2>${esc(cur)}</h2><p>تقرير المهام المنفذة · ${fmt(f)||"البداية"} — ${fmt(to)||"اليوم"}</p></div>
    <div class="rn"><b>${rows.length}</b><small>مهمة منفذة</small></div></div>
    ${rows.map((t,i)=>`<div class="rr"><i>${i+1}</i><span>${esc(t.title)}</span><em>${fmt(t.doneAt)}</em></div>`).join("")||"<p>لا توجد مهام منفذة في هذه الفترة.</p>"}`;
  $("modal").classList.remove("open");const o=document.title;document.title=`${cur} - تقرير ${today()}`;
  setTimeout(()=>{print();document.title=o},200);
};
load();
</script>
</body>
</html>
